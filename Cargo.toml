[package]
name = "codex-usage-win"
version = "1.0.5"
edition = "2021"
license = "MIT"
description = "Codex Usage Win"
homepage = "https://github.com/walle-2017/codex-usage-win"
repository = "https://github.com/walle-2017/codex-usage-win"

[package.metadata.winres]
CompanyName = "Ray"
ProductName = "Codex Usage Win"
FileDescription = "Codex Usage Win"
OriginalFilename = "codex-usage-win.exe"
InternalName = "CodexUsageWin"
Comments = "Derived from Claude Code Usage Monitor under the MIT License"
LegalCopyright = "Original copyright (C) 2026 Code Zeno Pty Ltd; modifications (C) 2026 Ray"

[features]
default = ["github-update"]
github-update = []
store = []

[dependencies]
ureq = { version = "2", default-features = false, features = ["native-tls", "json", "proxy-from-env"] }
native-tls = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
dirs = "6"

[dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_System_LibraryLoader",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_System_Registry",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
]

[build-dependencies]
cc = "1"
winres = "0.1"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
panic = "abort"
