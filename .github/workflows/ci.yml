name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  actions: write
  contents: read

jobs:
  cleanup-obsolete-workflow-history:
    runs-on: ubuntu-latest
    steps:
      - name: Delete runs from obsolete workflows
        uses: actions/github-script@v7
        with:
          script: |
            const obsoleteWorkflowIds = [
              352913813, // One-time obsolete branch cleanup
              372840829, // Publish v1.0.5
              364940518, // Generate embedded font assets
              360455619, // Finalize approved UI changes
              360273225, // Temporary RED cursor and titlebar contract
              360274075, // Temporary apply cursor and titlebar changes
              360144147, // Temporary style theme and text fix
              359231918, // Delete obsolete branches
              359230992, // Delete blur-tail repro branches
              355527210, // Rewrite renamed v1.0.3 and v1.0.4
            ];

            for (const workflow_id of obsoleteWorkflowIds) {
              const runs = await github.paginate(
                github.rest.actions.listWorkflowRuns,
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  workflow_id,
                  per_page: 100,
                },
              );

              for (const run of runs) {
                await github.rest.actions.deleteWorkflowRun({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: run.id,
                });
                core.info(`Deleted obsolete workflow run ${run.id}`);
              }
            }

  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify Codex CLI refresh is disabled
        shell: pwsh
        run: ./scripts/assert-no-codex-cli-refresh.ps1
      - name: Verify Codex-only runtime
        shell: pwsh
        run: ./scripts/assert-codex-only-runtime.ps1
      - name: Verify dead-code cleanup
        shell: pwsh
        run: ./scripts/assert-clean-codex-only-source.ps1
      - name: Verify branding contract
        shell: pwsh
        run: ./scripts/assert-branding.ps1
      - name: Verify v1.0.3 migration compatibility
        shell: pwsh
        run: ./scripts/assert-v103-update-compat.ps1
      - name: Verify version contract
        shell: pwsh
        run: ./scripts/assert-v1-version.ps1
      - name: Verify documentation
        shell: pwsh
        run: ./scripts/assert-final-docs.ps1
      - name: Verify Store update isolation
        shell: pwsh
        run: ./scripts/assert-store-build.ps1
      - name: Verify taskbar drag capture handling
        shell: pwsh
        run: ./scripts/assert-drag-handler-safe.ps1
      - name: Verify live drag anchor handling
        shell: pwsh
        run: ./scripts/assert-live-drag-anchor.ps1
      - name: Verify default taskbar UI contract
        shell: pwsh
        run: ./scripts/assert-default-ui.ps1
      - name: Verify v1.0.5 theme and style customization
        shell: pwsh
        run: ./scripts/assert-style-customization.ps1
      - name: Verify small-taskbar UI contract
        shell: pwsh
        run: ./scripts/assert-small-taskbar-ui.ps1
      - name: Verify language-independent quota semantics
        shell: pwsh
        run: ./scripts/assert-language-independent-quota.ps1
      - name: Verify auto-update safety contract
        shell: pwsh
        run: ./scripts/assert-auto-update.ps1
      - name: Verify startup update discovery contract
        shell: pwsh
        run: ./scripts/assert-startup-update-check.ps1
      - name: Verify persistent runtime logging contract
        shell: pwsh
        run: ./scripts/assert-runtime-log.ps1

      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: clippy

      - name: Run tests
        run: cargo test
      - name: Run Clippy
        run: cargo clippy -- -D warnings
      - name: Build release binary
        run: cargo build --release

      - name: Prepare artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/codex-usage-win.exe dist/codex-usage-win.exe
          $hash = (Get-FileHash -Algorithm SHA256 dist/codex-usage-win.exe).Hash.ToLowerInvariant()
          "$hash  codex-usage-win.exe" | Set-Content -Encoding ascii dist/codex-usage-win.exe.sha256

      - name: Upload Windows x64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: codex-usage-win-windows-x64
          path: |
            dist/codex-usage-win.exe
            dist/codex-usage-win.exe.sha256
          if-no-files-found: error
          retention-days: 14
