name: Generate embedded font assets

on:
  push:
    branches:
      - feature/v1.0.5-unified-settings
    paths:
      - scripts/prepare-font-assets.py
      - .github/workflows/font-assets.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v1.0.5-unified-settings
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install fonttools
        shell: pwsh
        run: python -m pip install --disable-pip-version-check "fonttools>=4.59,<5"
      - name: Build font assets
        shell: pwsh
        run: python scripts/prepare-font-assets.py
      - name: Commit generated font assets
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/fonts
          if (git diff --cached --quiet) {
            Write-Host "Font assets are already current."
            exit 0
          }
          git commit -m "assets: add embedded UI font subset"
          git push origin HEAD:feature/v1.0.5-unified-settings
