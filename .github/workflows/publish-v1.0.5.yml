name: Publish v1.0.5

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-v1.0.5.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pin verified release target
        shell: pwsh
        run: |
          $target = "${{ github.event.before }}"
          $expected = "d268bfca9bad963070e7af23d63f1b2e47e3584b"
          if ($target -ne $expected) {
            throw "Unexpected release target: $target (expected $expected)"
          }
          git checkout --detach $target

      - uses: dtolnay/rust-toolchain@1.97.0

      - name: Verify version
        shell: pwsh
        run: |
          $cargo = Get-Content -Raw Cargo.toml
          if ($cargo -notmatch '(?m)^version\s*=\s*"1\.0\.5"\s*$') {
            throw "Cargo.toml is not version 1.0.5"
          }

      - name: Build release binary
        run: cargo build --release

      - name: Prepare release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/codex-usage-win.exe dist/codex-usage-win.exe
          Copy-Item scripts/install.ps1 dist/install.ps1
          Copy-Item scripts/uninstall.ps1 dist/uninstall.ps1
          $hash = (Get-FileHash -Algorithm SHA256 dist/codex-usage-win.exe).Hash.ToLowerInvariant()
          "$hash  codex-usage-win.exe" | Set-Content -Encoding ascii dist/codex-usage-win.exe.sha256

      - name: Create or verify tag
        shell: pwsh
        run: |
          $target = "d268bfca9bad963070e7af23d63f1b2e47e3584b"
          git fetch --tags --force
          $existing = git tag --list "v1.0.5"
          if ($existing) {
            $resolved = (git rev-list -n 1 v1.0.5).Trim()
            if ($resolved -ne $target) {
              throw "Existing v1.0.5 tag points to $resolved instead of $target"
            }
          } else {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a v1.0.5 $target -m "Codex Usage Win v1.0.5"
            git push origin refs/tags/v1.0.5
          }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.5
          name: Codex Usage Win v1.0.5
          generate_release_notes: true
          make_latest: true
          files: |
            dist/codex-usage-win.exe
            dist/codex-usage-win.exe.sha256
            dist/install.ps1
            dist/uninstall.ps1
