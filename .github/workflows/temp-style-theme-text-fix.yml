name: Temporary style theme and text fix

on:
  push:
    branches:
      - feature/v1.0.5-style-settings-panel-v1

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v1.0.5-style-settings-panel-v1
          fetch-depth: 0

      - name: RED - confirm both regressions exist
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          style = Path('src/style_window.rs').read_text(encoding='utf-8')
          window = Path('src/window.rs').read_text(encoding='utf-8')

          def regression_contract():
              assert 'DWMWA_TRANSITIONS_FORCEDISABLED' in style, 'DWM title-bar transitions are still enabled'
              assert 'UpdateWindow(hwnd)' in style, 'style-panel repaint is still deferred'
              assert 'fn widget_text_quality()' in window, 'transparent widget text has no alpha-safe quality selector'
              assert 'NONANTIALIASED_QUALITY' in window, 'transparent widget text still relies on background-blended antialiasing'

          try:
              regression_contract()
          except AssertionError as error:
              print(f'RED confirmed: {error}')
          else:
              raise SystemExit('Regression probe unexpectedly passed before the fix')
          '@ | python -

      - name: Apply root-cause fixes and regression contracts
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {count}')
              return text.replace(old, new, 1)

          # 1) Make the DWM title bar switch immediately and force the client
          # area to repaint in the same UI turn.
          style_path = Path('src/style_window.rs')
          style = style_path.read_text(encoding='utf-8')
          style = replace_once(
              style,
              'use windows::Win32::Graphics::Dwm::{DwmSetWindowAttribute, DWMWA_USE_IMMERSIVE_DARK_MODE};',
              'use windows::Win32::Graphics::Dwm::{\n    DwmSetWindowAttribute, DWMWA_TRANSITIONS_FORCEDISABLED, DWMWA_USE_IMMERSIVE_DARK_MODE,\n};',
              'DWM import',
          )
          old_apply = '''fn apply_titlebar_theme(hwnd: HWND, is_dark: bool) {
    let enabled = BOOL::from(is_dark);
    unsafe {
        let _ = DwmSetWindowAttribute(
            hwnd,
            DWMWA_USE_IMMERSIVE_DARK_MODE,
            &enabled as *const BOOL as *const std::ffi::c_void,
            std::mem::size_of::<BOOL>() as u32,
        );
    }
}
'''
          new_apply = '''fn apply_titlebar_theme(hwnd: HWND, is_dark: bool) {
    let transitions_disabled = BOOL::from(true);
    let enabled = BOOL::from(is_dark);
    unsafe {
        // DWM otherwise animates the non-client title bar after the client area
        // has already repainted, which makes theme changes visibly two-stage.
        let _ = DwmSetWindowAttribute(
            hwnd,
            DWMWA_TRANSITIONS_FORCEDISABLED,
            &transitions_disabled as *const BOOL as *const std::ffi::c_void,
            std::mem::size_of::<BOOL>() as u32,
        );
        let _ = DwmSetWindowAttribute(
            hwnd,
            DWMWA_USE_IMMERSIVE_DARK_MODE,
            &enabled as *const BOOL as *const std::ffi::c_void,
            std::mem::size_of::<BOOL>() as u32,
        );
    }
}
'''
          style = replace_once(style, old_apply, new_apply, 'apply_titlebar_theme')
          old_sync_tail = '''    apply_titlebar_theme(hwnd, is_dark);
    layout_numeric_edits(hwnd);
    sync_numeric_edits();
    sync_blur_edit();
    unsafe {
        let _ = InvalidateRect(hwnd, None, false);
    }
}
'''
          new_sync_tail = '''    apply_titlebar_theme(hwnd, is_dark);
    layout_numeric_edits(hwnd);
    sync_numeric_edits();
    sync_blur_edit();
    unsafe {
        let _ = InvalidateRect(hwnd, None, false);
        // Commit the client-area theme in this message turn instead of leaving
        // it queued behind the non-client DWM update.
        let _ = UpdateWindow(hwnd);
    }
}
'''
          style = replace_once(style, old_sync_tail, new_sync_tail, 'style sync tail')
          style_path.write_text(style, encoding='utf-8')

          # 2) ClearType assumes an opaque RGB background. In the layered widget
          # its edge pixels are blended against the panel RGB and then promoted
          # to opaque foreground pixels, producing bright/white fringes when the
          # panel is translucent. Keep ClearType for opaque rendering, but use
          # binary glyph coverage on translucent/frosted layered surfaces.
          window_path = Path('src/window.rs')
          window = window_path.read_text(encoding='utf-8')
          sc_anchor = '''fn sc(px: i32) -> i32 {
    let dpi = CURRENT_DPI.load(Ordering::Relaxed);
    (px as f64 * dpi as f64 / 96.0).round() as i32
}
'''
          quality_helpers = sc_anchor + '''
fn text_quality_for_layered_surface(panel_alpha: u8, composition_blur_active: bool) -> u32 {
    if composition_blur_active || panel_alpha < u8::MAX {
        // GDI antialiasing blends glyph edges with the current RGB background.
        // UpdateLayeredWindow later treats changed pixels as opaque foreground,
        // so those blended edge colors become visible halos on transparent panels.
        NONANTIALIASED_QUALITY.0 as u32
    } else {
        CLEARTYPE_QUALITY.0 as u32
    }
}

fn widget_text_quality() -> u32 {
    let state = lock_state();
    let Some(s) = state.as_ref() else {
        return CLEARTYPE_QUALITY.0 as u32;
    };
    let panel_alpha = s
        .styles
        .active(s.is_dark)
        .color(StyleColorTarget::PanelBackground)
        .a;
    text_quality_for_layered_surface(panel_alpha, s.composition_blur_active)
}
'''
          window = replace_once(window, sc_anchor, quality_helpers, 'text-quality helper anchor')

          clear_count = window.count('CLEARTYPE_QUALITY.0 as u32')
          # Two helper return paths plus the three rendering sites are expected
          # after inserting the helper above.
          if clear_count != 5:
              raise SystemExit(f'expected 5 ClearType references after helper insertion, found {clear_count}')

          # Replace the three existing widget font creation sites, not the two
          # deliberate opaque fallbacks inside the helper itself.
          search_from = window.index('/// Paint widget foreground.')
          prefix = window[:search_from]
          rendering = window[search_from:]
          render_count = rendering.count('CLEARTYPE_QUALITY.0 as u32')
          if render_count != 3:
              raise SystemExit(f'expected 3 widget ClearType rendering sites, found {render_count}')
          rendering = rendering.replace('CLEARTYPE_QUALITY.0 as u32', 'widget_text_quality()')
          window = prefix + rendering

          tests_anchor = '''    #[test]
    fn frosted_strength_maps_linearly_to_gaussian_radius() {
'''
          new_tests = '''    #[test]
    fn transparent_layered_text_avoids_cleartype_background_fringe() {
        assert_eq!(
            text_quality_for_layered_surface(255, false),
            CLEARTYPE_QUALITY.0 as u32
        );
        assert_eq!(
            text_quality_for_layered_surface(254, false),
            NONANTIALIASED_QUALITY.0 as u32
        );
        assert_eq!(
            text_quality_for_layered_surface(255, true),
            NONANTIALIASED_QUALITY.0 as u32
        );
    }

''' + tests_anchor
          window = replace_once(window, tests_anchor, new_tests, 'layered text regression test anchor')
          window_path.write_text(window, encoding='utf-8')

          # Persist source-level regression checks in the existing CI contract.
          contract_path = Path('scripts/assert-style-customization.ps1')
          contract = contract_path.read_text(encoding='utf-8')
          marker = '# Theme-sync and layered-text regression contract'
          if marker not in contract:
              contract += r'''

# Theme-sync and layered-text regression contract
if ($styleWindow -notmatch 'DWMWA_TRANSITIONS_FORCEDISABLED' -or
    $styleWindow -notmatch 'UpdateWindow\(hwnd\)') {
    throw 'Style-panel client and title-bar theme changes must commit without a delayed DWM transition.'
}
if ($windowProduction -notmatch 'text_quality_for_layered_surface' -or
    $windowProduction -notmatch 'NONANTIALIASED_QUALITY' -or
    $windowProduction -notmatch 'widget_text_quality\(\)') {
    throw 'Transparent/frosted taskbar text must avoid ClearType background-fringe artifacts.'
}
'''
          contract_path.write_text(contract, encoding='utf-8')
          '@ | python -

      - name: GREEN - run style regression contract
        shell: pwsh
        run: ./scripts/assert-style-customization.ps1

      - name: Run tests
        run: cargo test --all-features

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Commit fixes
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/style_window.rs src/window.rs scripts/assert-style-customization.ps1
          if (git diff --cached --quiet) {
            Write-Host "No source changes to commit"
            exit 0
          }
          git commit -m "fix: synchronize theme chrome and transparent text rendering"
          git push origin HEAD:feature/v1.0.5-style-settings-panel-v1
