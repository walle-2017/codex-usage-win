name: Temporary style theme and text fix

on:
  push:
    branches:
      - feature/v1.0.5-style-settings-panel-v1

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v1.0.5-style-settings-panel-v1
          fetch-depth: 0

      - name: RED and apply root-cause fixes
        run: python scripts/temp-style-theme-text-fix.py

      - name: GREEN - run style regression contract
        shell: pwsh
        run: ./scripts/assert-style-customization.ps1

      - name: Run tests
        run: cargo test --all-features

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Commit fixes
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/style_window.rs src/window.rs scripts/assert-style-customization.ps1
          if (git diff --cached --quiet) {
            Write-Host "No source changes to commit"
            exit 0
          }
          git commit -m "fix: synchronize theme chrome and transparent text rendering"
          git push origin HEAD:feature/v1.0.5-style-settings-panel-v1
