name: One-time obsolete branch cleanup

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/cleanup-obsolete-branches.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete obsolete branches
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const branches = [
              "feature/v1.0.5-font-raster-segoe-ab",
              "feature/v1.0.5-settings-controls-fluent",
              "feature/v1.0.5-style-customization",
              "feature/v1.0.5-style-settings-panel-v1",
              "feature/v1.0.5-unified-settings",
            ];

            for (const branch of branches) {
              try {
                await github.rest.git.deleteRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: `heads/${branch}`,
                });
                core.info(`Deleted ${branch}`);
              } catch (error) {
                if (error.status === 422 || error.status === 404) {
                  core.info(`Skipped ${branch}: already absent or not deletable`);
                  continue;
                }
                throw error;
              }
            }
