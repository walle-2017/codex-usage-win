name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  RELEASE_ASSET_NAME: codex-usage-win.exe

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@1.97.0

      - name: Verify release tag matches Cargo version
        shell: pwsh
        run: |
          $manifest = Get-Content -Raw Cargo.toml
          $package = [regex]::Match($manifest, '(?ms)^\[package\]\s*.*?^version\s*=\s*"(?<version>\d+\.\d+\.\d+)"')
          if (-not $package.Success) { throw 'Cannot parse Cargo package version.' }
          $expectedTag = 'v' + $package.Groups['version'].Value
          if ('${{ github.ref_type }}' -ne 'tag' -or '${{ github.ref_name }}' -ne $expectedTag) {
            throw "Release requires tag $expectedTag, got ${{ github.ref_type }}:${{ github.ref_name }}."
          }

      - name: Build release binary
        run: cargo build --release --locked

      - name: Prepare release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/codex-usage-win.exe dist/codex-usage-win.exe
          Copy-Item scripts/install.ps1 dist/install.ps1
          Copy-Item scripts/uninstall.ps1 dist/uninstall.ps1
          $hash = (Get-FileHash -Algorithm SHA256 dist/codex-usage-win.exe).Hash.ToLowerInvariant()
          "$hash  codex-usage-win.exe" | Set-Content -Encoding ascii dist/codex-usage-win.exe.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/codex-usage-win.exe
            dist/codex-usage-win.exe.sha256
            dist/install.ps1
            dist/uninstall.ps1
          generate_release_notes: true
