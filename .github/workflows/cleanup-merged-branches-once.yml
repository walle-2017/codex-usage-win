name: Cleanup merged working branches (one-time)

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cleanup-merged-branches-once.yml
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  delete-merged-branches:
    if: github.repository == 'walle-2017/codex-usage-win' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check merge ancestry and delete only approved branches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cleanup() {
            local branch="$1" expected_sha="$2" pr_number="$3"
            local current_sha
            current_sha="$(git ls-remote --heads origin "refs/heads/$branch" | cut -f1)"
            if [ -z "$current_sha" ]; then
              echo "Already absent: $branch"
              return
            fi
            if [ "$current_sha" != "$expected_sha" ]; then
              echo "::error::Branch $branch moved; refusing deletion"
              exit 1
            fi
            local merged
            merged="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr_number" --jq '.merged')"
            if [ "$merged" != "true" ]; then
              echo "::error::PR #$pr_number is not merged; refusing deletion"
              exit 1
            fi
            if ! git merge-base --is-ancestor "$expected_sha" "$GITHUB_SHA"; then
              echo "::error::Branch $branch is not fully contained in main; refusing deletion"
              exit 1
            fi
            git push origin --delete "$branch"
            echo "Deleted merged branch: $branch"
          }
          cleanup 'feature/context-menu-optimization' '58f23f22bed2d431f64467a79ac5e5fd410c6a23' 28
          cleanup 'refactor/code-cleanup' '9430c0d67335b78749ec2fdb049334f81bb2cd03' 29
