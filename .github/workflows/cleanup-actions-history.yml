name: One-time Actions history cleanup

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/cleanup-actions-history.yml"

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete CI and Store MSIX Build run history
        uses: actions/github-script@v7
        with:
          script: |
            const workflowIds = [
              355520423, // CI
              355456252, // Store MSIX Build
            ];

            for (const workflow_id of workflowIds) {
              const runs = await github.paginate(
                github.rest.actions.listWorkflowRuns,
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  workflow_id,
                  per_page: 100,
                },
              );

              core.info(`Found ${runs.length} runs for workflow ${workflow_id}`);

              for (const run of runs) {
                if (run.status !== "completed") {
                  try {
                    await github.rest.actions.cancelWorkflowRun({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      run_id: run.id,
                    });
                    core.info(`Cancellation requested for run ${run.id}`);
                  } catch (error) {
                    core.info(`Cancellation skipped for run ${run.id}: ${error.message}`);
                  }
                }
              }

              for (const run of runs) {
                let deleted = false;
                for (let attempt = 1; attempt <= 12 && !deleted; attempt++) {
                  try {
                    await github.rest.actions.deleteWorkflowRun({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      run_id: run.id,
                    });
                    core.info(`Deleted run ${run.id}`);
                    deleted = true;
                  } catch (error) {
                    if (attempt === 12) throw error;
                    core.info(`Delete retry ${attempt} for run ${run.id}: ${error.message}`);
                    await new Promise(resolve => setTimeout(resolve, 5000));
                  }
                }
              }
            }
